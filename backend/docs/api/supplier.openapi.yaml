openapi: 3.0.0
info:
  title: Supplier API
  version: 1.0.0
paths:
  /api/v1/suppliers:
    get:
      summary: List suppliers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: companyId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A list of suppliers
    post:
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId:
                  type: string
                name:
                  type: string
                businessType:
                  type: string
                category:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: Supplier created
  /api/v1/suppliers/{id}:
    get:
      summary: Get supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Supplier details
    put:
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                name:
                  type: string
      responses:
        '200':
          description: Supplier updated
    delete:
      summary: Soft delete supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Supplier deleted
  /api/v1/suppliers/{id}/profile:
    get:
      summary: Get comprehensive supplier profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Supplier profile including contacts, bank accounts, tax info, and statistics
  /api/v1/suppliers/{id}/restore:
    post:
      summary: Restore soft-deleted supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Supplier restored
  /api/v1/suppliers/{id}/primary-contact:
    patch:
      summary: Set primary contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  type: string
      responses:
        '200':
          description: Primary contact set
  /api/v1/suppliers/{id}/primary-bank:
    patch:
      summary: Set primary bank account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankAccountId:
                  type: string
      responses:
        '200':
          description: Primary bank account set
