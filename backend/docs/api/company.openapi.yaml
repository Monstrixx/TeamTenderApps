openapi: 3.0.3
info:
  title: TeamTender API - Company Domain
  version: 1.0.0
paths:
  /companies:
    get:
      summary: Get all companies for current workspace
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ARCHIVED]
      responses:
        '200':
          description: A paginated list of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
    post:
      summary: Create a new company
      tags:
        - Company
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  /companies/{id}:
    get:
      summary: Get a company by ID
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A company object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
    put:
      summary: Update a company
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
    delete:
      summary: Soft delete a company
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  /companies/{id}/restore:
    post:
      summary: Restore a soft-deleted company
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'

  /companies/{id}/profile:
    get:
      summary: Get complete company profile (aggregate)
      tags:
        - Company
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complete company profile including legal, addresses, workspace, and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'

components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        code:
          type: string
        name:
          type: string
        legalName:
          type: string
          nullable: true
        businessType:
          type: string
        status:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        establishedDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CompanyLegal:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        nib:
          type: string
          nullable: true
        npwp:
          type: string
          nullable: true
        pkpNumber:
          type: string
          nullable: true
        deedNumber:
          type: string
          nullable: true
        deedDate:
          type: string
          format: date-time
          nullable: true
        ministryApprovalNumber:
          type: string
          nullable: true
        ministryApprovalDate:
          type: string
          format: date-time
          nullable: true
        taxOffice:
          type: string
          nullable: true
        businessSector:
          type: string
          nullable: true
        kbli:
          type: string
          nullable: true
        capital:
          type: number
          nullable: true
        employeeCount:
          type: integer
          nullable: true

    CompanyAddress:
      type: object
      properties:
        id:
          type: string
        companyId:
          type: string
        type:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        village:
          type: string
        postalCode:
          type: string
        address:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        isPrimary:
          type: boolean

    CreateCompanyRequest:
      type: object
      required:
        - name
        - businessType
        - status
      properties:
        name:
          type: string
        legalName:
          type: string
        businessType:
          type: string
        status:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        description:
          type: string
        establishedDate:
          type: string
          format: date-time

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        legalName:
          type: string
        businessType:
          type: string
        status:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        description:
          type: string
        establishedDate:
          type: string
          format: date-time

    CompanyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Company'
        meta:
          type: object
          properties:
            requestId:
              type: string

    CompanyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    CompanyProfileResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            company:
              $ref: '#/components/schemas/Company'
            legal:
              $ref: '#/components/schemas/CompanyLegal'
              nullable: true
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/CompanyAddress'
            workspace:
              type: object
            statistics:
              type: object
              properties:
                supplierCount:
                  type: integer
                equipmentCount:
                  type: integer
                personnelCount:
                  type: integer
                documentCount:
                  type: integer
        meta:
          type: object
          properties:
            requestId:
              type: string
